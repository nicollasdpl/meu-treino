<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#6200EE" />
  <!-- iOS PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=2025110411" />
  <!-- External libs -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.2/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <!-- App scripts -->
  <script defer src="firebase.js?v=2025110411"></script>
  <script defer src="charts.js?v=2025110411"></script>
  <script defer src="app.js?v=2025110411"></script>
  <title>Meu Treino 2.0</title>
</head>
<body>
  <!-- Login overlay (shown only when Firebase enabled and user not logged in) -->
  <div id="login-screen" class="pagina">
    <div class="login-container">
      <h1>Meu Treino 2.0</h1>
      <p>Faça login com Google para continuar</p>
      <button id="btnLogin" class="btn">Entrar com Google</button>
    </div>
  </div>
  <!-- Main App -->
  <div id="app" class="hidden">
    <header id="app-header">
      <h1 id="app-title">Meu Treino</h1>
      <div class="header-actions">
        <button id="btnNotif" title="Permitir notificações">🔔</button>
        <button id="btnTheme" title="Alternar tema">🌙</button>
      </div>
    </header>
    <main id="app-main">
      <!-- Home page -->
      <section id="home" class="pagina">
        <div class="calendario-container">
          <div class="cal-nav">
            <button id="calPrev">←</button>
            <span id="calTitle"></span>
            <button id="calNext">→</button>
          </div>
          <div id="calendario" class="calendario"></div>
        </div>
        <div id="resumo" class="resumo">
          <div>Dias treinados: <span id="diasTreinados">0</span></div>
          <div>Último treino: <span id="ultimoTreino">—</span></div>
          <div>Duração média: <span id="duracaoMedia">—</span></div>
          <div>Streak: <span id="streakCount">0</span></div>
        </div>
        <button id="btnStartToday" class="btn">Começar treino do dia</button>
      </section>
      <!-- Treino page -->
      <section id="treino" class="pagina"></section>
      <!-- Evolução page -->
      <section id="evolucao" class="pagina"></section>
      <!-- Perfil page -->
      <section id="perfil" class="pagina"></section>
    </main>
    <!-- Bottom navigation -->
    <nav id="bottom-nav">
      <button id="navHome" title="Home">🏠</button>
      <button id="navPerfil" title="Perfil">👤</button>
      <button id="navTreino" title="Treino">💪</button>
      <button id="navEvolucao" title="Evolução">📊</button>
    </nav>
  </div>
  <script>
    // Register the service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2025110411').catch(() => {});
      });
    }
  </script>
</body>
</html>
